name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate repository structure and Markdown links
        run: python3 scripts/validate_repo.py

      - name: Exercise startup bootstrap tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate zwslcore stack scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/install.sh
          bash -n scripts/doctor.sh
          bash -n scripts/smoke.sh
          bash -n scripts/wait-runtime.sh
          bash -n scripts/bootstrap-wsl.sh
          python3 -m py_compile scripts/sync-free-models.py scripts/engineer.py services/model_catalog/catalog.py
          python3 -m compileall -q services/provider/zeaz_provider services/engineering
          python3 -m unittest tests.test_model_catalog tests.test_engineering_control_plane -v
          cp .env.example .env
          docker compose --env-file .env config --quiet
          if grep -Eq '(^|:)(latest|main)$' .env.example; then
            echo 'Mutable runtime image tag found in .env.example'
            exit 1
          fi
          docker compose --env-file .env build provider
          rm -f .env

      - name: Check for common secret file names
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|id_rsa|id_ed25519|.*\.pem|.*\.key)$' | grep -v '^\.env\.example$'; then
            echo 'Potential secret-bearing file is tracked.'
            exit 1
          fi

      - name: Validate YAML syntax
        shell: bash
        run: |
          ruby -e 'require "yaml"; Dir.glob(".github/**/*.{yml,yaml}").each { |f| YAML.load_file(f); puts "ok #{f}" }'

  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/install-wsl2.ps1'),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Parse Windows doctor wrapper
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/doctor-wsl.ps1'),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Parse engineering WSL wrapper
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/engineer-wsl.ps1'),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Validate engineering WSL argument binding
        shell: pwsh
        run: |
          $command = Get-Command ./scripts/engineer-wsl.ps1
          $metadata = [System.Management.Automation.CommandMetadata]::new($command)
          $engineer = $metadata.Parameters['EngineerArgs']
          if ($null -eq $engineer) {
            throw 'EngineerArgs parameter is missing.'
          }
          $position = $engineer.Attributes |
            Where-Object { $_ -is [System.Management.Automation.ParameterAttribute] } |
            Select-Object -First 1
          if ($position.Position -ne 0 -or -not $position.ValueFromRemainingArguments) {
            throw 'EngineerArgs must bind position 0 and remaining positional arguments.'
          }

      - name: Validate installer local assets
        shell: pwsh
        run: |
          ./scripts/install-wsl2.ps1 -ValidateOnly
