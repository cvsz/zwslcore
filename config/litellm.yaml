model_list:
  - model_name: zeaz-fast
    litellm_params:
      model: os.environ/ZEAZ_LITELLM_FAST_MODEL
      api_base: http://ollama:11434

  - model_name: zeaz-coder
    litellm_params:
      model: os.environ/ZEAZ_LITELLM_CODER_MODEL
      api_base: http://ollama:11434

  - model_name: zeaz-reasoning
    litellm_params:
      model: os.environ/ZEAZ_LITELLM_REASONING_MODEL
      api_base: http://ollama:11434

  - model_name: zeaz-skill-embedding
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://ollama:11434

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 120

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  disable_env_credential_login: true

litellm_settings:
  skill_search_embedding_model: zeaz-skill-embedding
  drop_params: true
  set_verbose: false
